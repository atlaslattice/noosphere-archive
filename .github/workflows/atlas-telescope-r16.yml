name: Atlas Telescope R16 portable source checks
on:
  pull_request:
    paths:
      - 'tools/telescope-r16/**'
      - '.github/workflows/atlas-telescope-r16.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-synthetic-negative-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install math dependency (no model runtime)
        run: python -m pip install 'numpy>=2.0,<3'
      - name: Public-safe synthetic tests
        run: python -m unittest discover -s tools/telescope-r16/tests -v
      - name: Assert-optimized tests preserve failures
        run: python -O -m unittest discover -s tools/telescope-r16/tests -v
