name: Atlas BEAST20 integrated source checks
on:
  pull_request:
    paths:
      - 'research/meta145c_glyph_knowledge/**'
      - '.github/workflows/beast20-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pinned Atlas engineering source
        uses: actions/checkout@v4
        with:
          repository: atlaslattice/Atlas-Intelligence
          ref: 389965f3aaa90c99815f8c727836ca342ef7f313
          path: upstream-atlas-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Long-horizon native engine toolchain
        run: g++ --version
      - name: Existing repository contracts
        run: python -m unittest discover -s tests -p 'test*.py'
      - name: Existing META145 source contracts
        run: python -m unittest discover -s tools/meta145/tests -p 'test*.py'
      - name: Inherited glyph memory and GF8 contracts
        working-directory: research/meta145c_glyph_knowledge
        run: |
          python -m unittest discover -s tests_public -p 'test*.py'
          python -m unittest discover -s tests -p 'test*.py'
      - name: BEAST20 integration and independent regressions
        working-directory: research/meta145c_glyph_knowledge
        env:
          ATLAS_EXCELLENCE_ROOT: ${{ github.workspace }}/upstream-atlas-intelligence
          ATLAS_EXCELLENCE_PLAN: ${{ github.workspace }}/upstream-atlas-intelligence/programs/excellence1728/outputs/ATLAS_EXCELLENCE_1728_PLAN.json
        run: |
          python -m unittest discover -s tests_beast20 -p 'test*.py'
          python -O -m unittest discover -s tests_beast20 -p 'test*.py'
          python -m src.beast20 demo
      - name: GF9 and unified 1728 source contracts
        working-directory: research/meta145c_glyph_knowledge/gf9_rosetta_v2
        run: python -m unittest discover -s tests -p 'test*.py'
      - name: Unified 1728 source contracts
        working-directory: research/meta145c_glyph_knowledge/gf9_rosetta_v2/unified_1728_r1
        run: python -m unittest discover -s tests -p 'test*.py'
