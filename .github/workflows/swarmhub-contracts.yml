name: SwarmHub source-only contracts
on:
  pull_request:
    paths:
      - 'core/**'
      - 'tests/test_swarmhub_contracts.py'
      - 'docs/SWARMHUB_CONTRACTS_v01.md'
      - 'docs/CANON_CANDIDATE_QUEUE.md'
      - '.github/workflows/swarmhub-contracts.yml'
  workflow_dispatch:
jobs:
  offline-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source-only module
        run: python -m py_compile core/__init__.py core/swarmhub_contracts.py
      - name: Run local contract tests (no secrets or network)
        run: python -m unittest discover -s tests -v